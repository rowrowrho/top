<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ρ おしゃべりアバター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2A46; --navy2:#173A5E; --blue:#2E76B6; --amber:#F5B84E; --teal:#17A98D;
  --ink:#EAF2FA; --ink2:#A9BED3; --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  color:var(--ink); background:var(--navy); overflow:hidden;
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
}
body[data-bg="navy"]{background:radial-gradient(120% 90% at 50% 20%, #1D4A78 0%, #0F2A46 60%, #0A1D33 100%)}
body[data-bg="transparent"]{background:transparent}
body[data-bg="green"]{background:#00B140}
body[data-bg="white"]{background:#FFFFFF}

/* ---- ステージ ---- */
.stage{position:fixed;left:0;right:0;top:0;display:flex;justify-content:center;align-items:flex-end;opacity:0;transition:opacity .4s}
.stage.ready{opacity:1}
.avatar{position:relative;transform-origin:50% 100%;will-change:transform}
.avatar img{
  position:absolute;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;
}
.avatar img.base{left:0;top:0;width:100%;height:100%;object-fit:contain}
.avatar img.ov{opacity:0;object-fit:fill}

/* ---- 操作パネル ---- */
.panel{
  position:fixed;left:0;right:0;bottom:0;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(10,29,51,.94); border-top:1px solid var(--line);
  border-radius:18px 18px 0 0; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  max-width:760px; margin:0 auto;
}
.panel[hidden],.show-btn[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.row.nowrap{flex-wrap:nowrap}
.row:last-child{margin-bottom:0}
.lab{font-size:12px;color:var(--ink2);white-space:nowrap}
.btn{
  font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--navy2);
  border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--amber);color:#1A2B3C;border-color:var(--amber)}
.btn.primary.on{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.small{font-size:12px;padding:6px 9px;min-height:38px;white-space:nowrap}
.btn[aria-pressed="true"]{outline:2px solid var(--amber);background:#24507F}
.btn[disabled]{opacity:.55;cursor:default}
.meter{position:relative;flex:1;min-width:120px;height:14px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}
#meterBar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blue)}
#thrMark{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--amber)}
.state{font-size:12px;font-weight:700;min-width:5.6em;text-align:right;white-space:nowrap}
input[type=range]{flex:1;min-width:90px;accent-color:var(--amber)}
.msg{font-size:12px;color:var(--amber);min-height:1.3em;margin:0 0 6px;line-height:1.5}
.hint{font-size:12px;color:var(--ink2);line-height:1.6}
details{margin-top:2px}
summary{font-size:13px;color:var(--ink2);cursor:pointer}
code{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
.show-btn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5}
</style>
</head>
<body data-bg="navy">

<div class="stage" id="stage">
  <div class="avatar" id="avatar" aria-label="おしゃべりするキャラクター"></div>
</div>

<div class="panel" id="panel">
  <div class="row">
    <button class="btn primary" id="micBtn" type="button">マイクをオンにする</button>
    <button class="btn" id="demoBtn" type="button" aria-pressed="false">デモ(マイクなし):オフ</button>
  </div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="row nowrap">
    <span class="lab">声の大きさ</span>
    <div class="meter"><div id="meterBar"></div><div id="thrMark"></div></div>
    <span class="state" id="mouthState">口:とじ</span>
  </div>
  <div class="row nowrap">
    <span class="lab">開きやすさ <b id="sensVal">6</b></span>
    <input type="range" id="sens" min="1" max="10" step="1" value="6" aria-label="口の開きやすさ(1〜10)">
    <button class="btn small" id="calBtn" type="button">音を測る</button>
  </div>
  <div class="row nowrap" id="bgRow">
    <span class="lab">背景</span>
    <button class="btn small" type="button" data-bg="transparent" aria-pressed="false">透過</button>
    <button class="btn small" type="button" data-bg="navy" aria-pressed="true">ネイビー</button>
    <button class="btn small" type="button" data-bg="green" aria-pressed="false">グリーン</button>
    <button class="btn small" type="button" data-bg="white" aria-pressed="false">ホワイト</button>
  </div>
  <div class="row">
    <button class="btn small" id="hideBtn" type="button">操作パネルを隠す</button>
    <span class="hint">隠したあとは右下のボタンで戻せます</span>
  </div>
  <details>
    <summary>配信ソフト(OBSなど)で使うとき</summary>
    <p class="hint">ページのURLの最後に <code>?ui=0&amp;bg=transparent</code> を付けると、操作パネルなしで背景が透明の表示になります。マイクの感度は先にこの画面で合わせておいてください(<code>&amp;sens=6</code> のように数字で指定もできます)。</p>
  </details>
</div>
<button class="btn show-btn" id="showBtn" type="button" hidden>操作パネルを出す</button>

  // 重ねる位置(全身画像に対する %)[左, 上, 幅, 高さ]
  var GEOM = {
    eye:   [40.0391, 29.9479, 35.1562, 11.7188],
    mouth: [47.8516, 38.2812, 12.8906, 7.2917]
  };

  /* ================= 要素 ================= */
  function $(id) { return document.getElementById(id); }
  var stage = $('stage'), avatar = $('avatar'), panel = $('panel'), showBtn = $('showBtn');
  var micBtn = $('micBtn'), demoBtn = $('demoBtn'), msgEl = $('msg');
  var meterBar = $('meterBar'), thrMark = $('thrMark'), mouthStateEl = $('mouthState');
  var sensEl = $('sens'), sensVal = $('sensVal'), calBtn = $('calBtn'), hideBtn = $('hideBtn');
  var bgButtons = document.querySelectorAll('#bgRow button');

  /* ================= URLパラメータ ================= */
  function getParam(name) {
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  function store(key, val) { try { localStorage.setItem('rhoAvatar.' + key, String(val)); } catch (e) {} }
  function load(key) { try { return localStorage.getItem('rhoAvatar.' + key); } catch (e) { return null; } }

  var uiParam = getParam('ui');
  var uiForcedOff = (uiParam === '0');
  var panelVisible = CONFIG.SHOW_PANEL && !uiForcedOff;

  /* ================= 画像の読み込み ================= */
  var loaded = 0, TOTAL = 5;
  function onLoaded() { loaded++; if (loaded === TOTAL) { stage.className = 'stage ready'; } }
  function addImg(src, cls, geom) {
    var img = new Image();
    img.alt = ''; img.draggable = false; img.className = cls;
    if (geom) {
      img.style.left = geom[0] + '%'; img.style.top = geom[1] + '%';
      img.style.width = geom[2] + '%'; img.style.height = geom[3] + '%';
    }
    img.onload = onLoaded;
    img.src = src;
    avatar.appendChild(img);
    return img;
  }
  addImg(BASE, 'base', null);
  var layers = {
    eye:   [null, addImg(OV.eye1, 'ov', GEOM.eye),     addImg(OV.eye2, 'ov', GEOM.eye)],
    mouth: [null, addImg(OV.mouth1, 'ov', GEOM.mouth), addImg(OV.mouth2, 'ov', GEOM.mouth)]
  };

  /* ================= 状態 ================= */
  var level = { eye: 0, mouth: 0 };   // eye: 0=あき 1=はんぶん 2=とじ / mouth: 0=とじ 1=はんぶん 2=あき
  var fadeTimer = { eye: null, mouth: null };
  var speak = 0;                 // 0〜1(弾み用になめらかにした口の状態)
  var lastChange = 0;
  var sens = CONFIG.DEFAULT_SENS;
  var micOn = false, demoOn = false;
  var ctx = null, analyser = null, buf = null, stream = null, srcNode = null;
  var calibrating = false, calMax = 0, calUntil = 0;

  function thrFromSens(s) { return 0.10 * Math.pow(0.08, (s - 1) / 9); }
  function sensFromThr(t) { return 1 + 9 * Math.log(t / 0.10) / Math.log(0.08); }

  function setMsg(t) { msgEl.textContent = t || ''; }

  // 目や口の段階を切り替える(重ねた画像を、なめらかに出し入れする)
  function setLevel(group, lv) {
    var prev = level[group];
    if (prev === lv) { return; }
    level[group] = lv;
    var L = layers[group];
    var fade = CONFIG.ENABLE_FADE ? ('opacity ' + FADE_MS + 'ms linear') : 'none';
    for (var i = 1; i <= 2; i++) {
      if (i !== prev && i !== lv) { L[i].style.transition = 'none'; L[i].style.opacity = '0'; }
    }
    if (lv > 0) {
      L[lv].style.zIndex = '3';
      L[lv].style.transition = fade;
      L[lv].style.opacity = '1';
      if (prev > 0) {
        L[prev].style.zIndex = '2';
        clearTimeout(fadeTimer[group]);
        fadeTimer[group] = setTimeout(function () {
          if (level[group] !== prev) { L[prev].style.transition = 'none'; L[prev].style.opacity = '0'; }
        }, (CONFIG.ENABLE_FADE ? FADE_MS : 0) + 20);
      }
    } else if (prev > 0) {
      L[prev].style.transition = fade;
      L[prev].style.opacity = '0';
    }
  }

  /* ================= レイアウト ================= */
  function layout() {
    var ph = panelVisible ? panel.offsetHeight : 0;
    var h = Math.max(120, window.innerHeight - ph);
    var w = Math.min(window.innerWidth, h * 2 / 3);
    stage.style.height = h + 'px';
    avatar.style.width = w + 'px';
    avatar.style.height = (w * 1.5) + 'px';
  }
  function setPanel(v) {
    panelVisible = v;
    panel.hidden = !v;
    showBtn.hidden = v || uiForcedOff;
    layout();
  }

  /* ================= 背景 ================= */
  function setBg(name) {
    document.body.setAttribute('data-bg', name);
    for (var i = 0; i < bgButtons.length; i++) {
      bgButtons[i].setAttribute('aria-pressed', bgButtons[i].getAttribute('data-bg') === name ? 'true' : 'false');
    }
    store('bg', name);
  }

  /* ================= マイク ================= */
  function startMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMsg('このブラウザではマイクが使えません。SafariかChromeで開いてください。');
      return;
    }
    micBtn.disabled = true;
    setMsg('マイクの許可を待っています…');
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false }
    }).then(function (s) {
      stream = s;
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      if (ctx.resume) { ctx.resume(); }
      srcNode = ctx.createMediaStreamSource(s);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0;
      srcNode.connect(analyser);
      buf = new Uint8Array(analyser.fftSize);
      micOn = true;
      micBtn.disabled = false;
      micBtn.textContent = 'マイクをオフにする';
      micBtn.className = 'btn primary on';
      setMsg('マイクがオンです。話すと口が動きます。動かないときは「口の開きやすさ」を上げてください。');
    }).catch(function (e) {
      micBtn.disabled = false;
      var name = e && e.name ? e.name : '';
      if (name === 'NotAllowedError' || name === 'SecurityError') {
        setMsg('マイクが許可されていません。ブラウザの設定でこのページのマイクを許可してください。');
      } else if (name === 'NotFoundError') {
        setMsg('マイクが見つかりません。');
      } else {
        setMsg('マイクを開始できませんでした。(' + name + ')');
      }
    });
  }
  function stopMic() {
    micOn = false;
    try { if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); } } catch (e) {}
    try { if (ctx && ctx.close) { ctx.close(); } } catch (e) {}
    stream = null; ctx = null; analyser = null; srcNode = null;
    micBtn.textContent = 'マイクをオンにする';
    micBtn.className = 'btn primary';
    setMsg('マイクをオフにしました。');
  }
  function readLevel() {
    if (!analyser) { return 0; }
    analyser.getByteTimeDomainData(buf);
    var sum = 0;
    for (var i = 0; i < buf.length; i++) {
      var v = (buf[i] - 128) / 128;
      sum += v * v;
    }
    return Math.sqrt(sum / buf.length);
  }

  /* ================= デモ(マイクなし) ================= */
  var demo = { open: false, until: 0, count: 0 };
  function demoLevel(now) {
    if (now > demo.until) {
      if (demo.open) {
        demo.open = false; demo.count++;
        demo.until = now + ((demo.count % 6 === 0) ? 700 + Math.random() * 400 : 70 + Math.random() * 110);
      } else {
        demo.open = true;
        demo.until = now + 90 + Math.random() * 130;
      }
    }
    return demo.open ? 0.03 + Math.random() * 0.08 : 0.002;
  }

  /* ================= まわりの音を測る ================= */
  function startCalibration() {
    if (!micOn) { setMsg('先に「マイクをオンにする」を押してください。'); return; }
    calibrating = true; calMax = 0; calUntil = performance.now() + 1500;
    calBtn.disabled = true;
    setMsg('1.5秒間、声を出さずに待ってください…');
  }

  /* ================= まばたき ================= */
  // あき → はんぶん → とじ → はんぶん → あき
  function doBlink(cb) {
    setLevel('eye', 1);
    setTimeout(function () {
      setLevel('eye', 2);
      setTimeout(function () {
        setLevel('eye', 1);
        setTimeout(function () { setLevel('eye', 0); if (cb) { cb(); } }, 50);
      }, 70);
    }, 45);
  }
  function scheduleBlink() {
    if (!CONFIG.ENABLE_BLINK) { return; }
    setTimeout(function () {
      doBlink(function () {
        if (Math.random() < 0.2) { setTimeout(function () { doBlink(scheduleBlink); }, 120); }
        else { scheduleBlink(); }
      });
    }, 2200 + Math.random() * 3200);
  }

  /* ================= メインループ ================= */
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  function tick(now) {
    if (micOn && ctx && ctx.state === 'suspended' && ctx.resume) { try { ctx.resume(); } catch (e) {} }
    var rms = demoOn ? demoLevel(now) : (micOn ? readLevel() : 0);

    if (calibrating) {
      if (rms > calMax) { calMax = rms; }
      if (now > calUntil) {
        calibrating = false; calBtn.disabled = false;
        var t = Math.min(0.1, Math.max(0.006, calMax * 1.6));
        var s = Math.round(Math.max(1, Math.min(10, sensFromThr(t))));
        sens = s; sensEl.value = String(s); sensVal.textContent = String(s); store('sens', s);
        setMsg('まわりの音に合わせて、口の開きやすさを ' + s + ' にしました。');
      }
    }

    var thr = thrFromSens(sens);
    meterBar.style.width = Math.min(100, rms / METER_MAX * 100) + '%';
    thrMark.style.left = Math.min(99, thr / METER_MAX * 100) + '%';

    // 口は3段階。大きくなるときは一気に、小さくなるときは1段ずつ
    var m = level.mouth, t2 = thr * 2.2;
    var up = m;
    if (rms > t2) { up = 2; } else if (rms > thr && m < 1) { up = 1; }
    if (up > m) {
      if (now - lastChange > MIN_UP_MS) { m = up; lastChange = now; }
    } else if (m === 2 && rms < t2 * 0.7 && now - lastChange > MIN_HOLD_MS) {
      m = 1; lastChange = now;
    } else if (m === 1 && rms < thr * 0.6 && now - lastChange > MIN_HOLD_MS) {
      m = 0; lastChange = now;
    }
    setLevel('mouth', m);
    mouthStateEl.textContent = (m === 2) ? '口:あき' : ((m === 1) ? '口:はんぶん' : '口:とじ');
    speak += ((m / 2) - speak) * 0.15;

    if (CONFIG.ENABLE_SWAY && !reduceMotion) {
      var h = avatar.offsetHeight || 1;
      var y = Math.sin(now * 0.0021) * h * 0.004;
      if (CONFIG.ENABLE_BOUNCE) { y -= speak * h * 0.006; }
      var r = Math.sin(now * 0.0011) * 0.6;
      var sy = 1 + 0.004 * Math.sin(now * 0.0021 + 1);
      avatar.style.transform = 'translateY(' + y.toFixed(2) + 'px) rotate(' + r.toFixed(3) + 'deg) scale(' + (2 - sy).toFixed(4) + ',' + sy.toFixed(4) + ')';
    }

    window.requestAnimationFrame(tick);
  }

  /* ================= イベント ================= */
  micBtn.addEventListener('click', function () { if (micOn) { stopMic(); } else { startMic(); } });
  demoBtn.addEventListener('click', function () {
    demoOn = !demoOn;
    demoBtn.setAttribute('aria-pressed', demoOn ? 'true' : 'false');
    demoBtn.textContent = 'デモ(マイクなし):' + (demoOn ? 'オン' : 'オフ');
  });
  sensEl.addEventListener('input', function () {
    sens = parseFloat(sensEl.value); sensVal.textContent = String(sens); store('sens', sens);
  });
  calBtn.addEventListener('click', startCalibration);
  hideBtn.addEventListener('click', function () { setPanel(false); });
  showBtn.addEventListener('click', function () { setPanel(true); });
  for (var i = 0; i < bgButtons.length; i++) {
    bgButtons[i].addEventListener('click', function (ev) { setBg(ev.currentTarget.getAttribute('data-bg')); });
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 200); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'h' || e.key === 'H') { setPanel(!panelVisible); }
  });

  /* ================= 初期化 ================= */
  var bg = getParam('bg') || load('bg') || CONFIG.DEFAULT_BG;
  if (['transparent', 'navy', 'green', 'white'].indexOf(bg) < 0) { bg = CONFIG.DEFAULT_BG; }
  setBg(bg);

  var sp = getParam('sens') || load('sens');
  if (sp !== null && !isNaN(parseFloat(sp))) { sens = Math.max(1, Math.min(10, parseFloat(sp))); }
  sensEl.value = String(sens); sensVal.textContent = String(sens);

  setPanel(panelVisible);
  if (CONFIG.AUTO_MIC || getParam('mic') === '1') { startMic(); }
  scheduleBlink();
  window.requestAnimationFrame(tick);
})();
</script>
</body>
</html>
