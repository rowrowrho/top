<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品｜歌い手ρ</title>
<meta name="description" content="歌い手ρの歌ってみた・MIX・動画の作品まとめ。サムネイルを押すとYouTubeで見られます。">
<meta property="og:title" content="作品｜歌い手ρ">
<meta property="og:description" content="歌ってみた・MIX・動画の作品まとめ">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ME8HE69PX8"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-ME8HE69PX8');
</script>
<style>
:root{
  --navy:#173A5E; --navy-d:#0F2A46; --blue:#2E76B6; --amber:#F5B84E; --teal:#17A98D;
  --bg:#F5F8FB; --card:#fff; --text:#1B2A3A; --sub:#5B6B7C; --line:#DCE4EC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Zen Kaku Gothic New",sans-serif;background:var(--bg);color:var(--text);line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:var(--navy-d);color:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-weight:900;letter-spacing:.04em}
header a.back{font-size:13px;font-weight:500;opacity:.9}
.hero{background:linear-gradient(160deg,var(--navy-d),var(--navy) 70%,#1F4F80);color:#fff;padding:40px 0 34px}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;color:var(--navy-d);background:var(--amber);padding:2px 12px;border-radius:99px;margin-bottom:12px}
.hero h1{font-size:30px;font-weight:900;line-height:1.4;margin-bottom:8px}
.hero p{font-size:14.5px;opacity:.92}
main{padding:26px 0 8px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.bar label{font-size:14px;font-weight:700;color:var(--navy)}
.bar select{font-family:inherit;font-size:15px;font-weight:700;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 36px 8px 14px;min-height:44px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--navy) 50%),linear-gradient(135deg,var(--navy) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.bar[hidden]{display:none}
.bar .cnt{font-size:13px;color:var(--sub)}
.grp{font-size:15px;font-weight:900;color:var(--navy);margin:22px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.grp:first-child{margin-top:4px}
.grp small{font-size:12px;font-weight:700;color:var(--sub);margin-left:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid + .grp{margin-top:26px}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(15,42,70,.06)}
.card .th{position:relative;aspect-ratio:16/9;background:#E9EFF5;overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card .play{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:rgba(15,42,70,.82);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;padding-left:2px}
.card .txt{padding:10px 12px 12px}
.card .cat{display:inline-block;font-size:11.5px;font-weight:900;color:var(--navy-d);background:#FFF6E3;border:1.5px solid var(--amber);border-radius:99px;padding:0 9px;line-height:1.6}
.card .cat.mix{background:#E3F6F1;border-color:var(--teal)}
.card .cat.mov{background:#E3EEF8;border-color:var(--blue)}
.card h3{font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.55;margin-top:6px;word-break:break-word}
.card .yr{font-size:12px;color:var(--sub);margin-top:2px}
.state{font-size:14px;color:var(--sub);padding:18px 2px}
.state a{color:var(--blue);text-decoration:underline;font-weight:700}
.more{margin:30px 0 8px;display:grid;gap:10px}
.more a{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:700;font-size:14.5px;color:var(--navy)}
.more a small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
footer{padding:26px 0 40px;text-align:center;font-size:12px;color:var(--sub)}
a:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap">
  <span class="brand">歌い手ρ</span>
  <a class="back" href="../" data-track="works_back">← トップへ</a>
</div></header>

<div class="hero"><div class="wrap">
  <span class="eyebrow">WORKS</span>
  <h1>今まで作った作品</h1>
  <p>年を選ぶと、その年の作品が見られます。サムネイルを押すとYouTubeで開きます。</p>
</div></div>

<main><div class="wrap">
  <div class="bar" id="bar" hidden><label for="yearSel">年</label><select id="yearSel"></select><span class="cnt" id="cnt"></span></div>
  <div id="list"></div>
  <p class="state" id="state">作品を読み込み中です…</p>

  <div class="more">
    <a href="https://youtube.com/@row_row_rho" target="_blank" rel="noopener" data-track="works_youtube">YouTubeチャンネル<small>全ての動画はこちら</small></a>
  </div>
</div></main>
<footer><div class="wrap">© 歌い手ρ</div></footer>

<script>
/* ===== 設定 =====
   作品の一覧は、Googleスプレッドシート「ライブ履歴管理(歌い手ρ)」の「作品」シートから読み込みます。
   シートは「リンクを知っている全員が閲覧可」にしておいてください。 */
var SHEET_ID  = '1eiZaXxZ5tjReIJGOMoWcFT_HDeXB0zMFhTVOfnIEm38';
var SHEET_GID = '2';
var CSV_URL   = '';   // 「ウェブに公開」(CSV)のURLを入れると、そちらを優先します
var CAT_ORDER = ['歌ってみた','MIX','MIX & 動画','動画'];   // タブの並び順(これ以外のカテゴリ名は後ろに追加されます)
var CAT_CLASS = {'歌ってみた':'', 'MIX':'mix', 'MIX & 動画':'mix', '動画':'mov'};

(function(){
  var listEl = document.getElementById('list'), barEl = document.getElementById('bar'), sel = document.getElementById('yearSel'), cntEl = document.getElementById('cnt'), stateEl = document.getElementById('state');
  var items = [], current = 'all';
  var NOYEAR = 'none';

  function track(name, extra){ if (window.gtag) { var p = {link_name:name}; if (extra) for (var k in extra) p[k]=extra[k]; gtag('event','hub_click',p); } }

  function parseCsv(text){
    text = text.replace(/^﻿/, '');
    var rows=[], row=[], cell='', q=false, i=0, c;
    for (; i<text.length; i++){
      c = text[i];
      if (q){
        if (c==='"'){ if (text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
        else cell+=c;
      } else if (c==='"'){ q=true; }
      else if (c===','){ row.push(cell); cell=''; }
      else if (c==='\n' || c==='\r'){
        if (c==='\r' && text[i+1]==='\n') i++;
        row.push(cell); cell=''; rows.push(row); row=[];
      } else cell+=c;
    }
    if (cell!=='' || row.length){ row.push(cell); rows.push(row); }
    return rows;
  }

  // YouTubeのURL(watch / youtu.be / shorts / embed / live) → 動画ID
  function ytId(u){
    u = String(u||'').trim();
    var m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:shorts\/|embed\/|live\/|v\/)|[?&]v=)([\w-]{11})(?![\w-])/);
    return m ? m[1] : '';
  }

  function toItems(rows){
    if (!rows.length) return [];
    var head = rows[0].map(function(s){ return String(s).trim(); });
    function col(re, fallback){ for (var i=0;i<head.length;i++) if (re.test(head[i])) return i; return fallback; }
    var cCat = col(/カテゴリ/,0), cUrl = col(/リンク|URL/i,1), cTtl = col(/タイトル/,2), cYr = col(/年/,3), cHide = col(/非表示/,5);
    var out = [];
    for (var r=1; r<rows.length; r++){
      var x = rows[r];
      var hide = String(x[cHide]||'').trim().toUpperCase();
      if (hide==='TRUE' || hide==='1' || hide==='はい') continue;
      var id = ytId(x[cUrl]);
      if (!id) continue;
      var yr = (String(x[cYr]||'').match(/\d{4}/)||[''])[0];
      out.push({n:r, cat:String(x[cCat]||'').trim() || '動画', id:id, title:String(x[cTtl]||'').trim(), year:yr});
    }
    // 新しい年が上。年が同じ・空欄のものはシートの下の行(あとから足した作品)が上
    out.sort(function(a,b){
      var ya = a.year||'0', yb = b.year||'0';
      if (ya!==yb) return ya<yb?1:-1;
      return b.n - a.n;
    });
    return out;
  }

  function catOrder(list){
    var seen = {}; list.forEach(function(it){ seen[it.cat]=1; });
    var o = CAT_ORDER.filter(function(c){ return seen[c]; });
    Object.keys(seen).forEach(function(c){ if (o.indexOf(c)<0) o.push(c); });
    return o;
  }

  function buildSelect(){
    var years = {}, noyear = 0;
    items.forEach(function(it){ if (it.year) years[it.year]=(years[it.year]||0)+1; else noyear++; });
    var ys = Object.keys(years).sort().reverse();
    sel.textContent = '';
    function opt(v, label){ var o = document.createElement('option'); o.value = v; o.textContent = label; sel.appendChild(o); }
    ys.forEach(function(y){ opt(y, y + '年（' + years[y] + '）'); });
    if (noyear && ys.length) opt(NOYEAR, '年の記載なし（' + noyear + '）');
    opt('all', 'すべて（' + items.length + '）');
    // 初期表示: ?year=2025 があればそれ、なければ最新の年(年の記載が1件もなければ「すべて」)
    var qy = (location.search.match(/[?&]year=(\d{4}|all)/)||[])[1];
    current = (qy && (qy==='all' || years[qy])) ? qy : (ys.length ? ys[0] : 'all');
    sel.value = current;
    barEl.hidden = (ys.length === 0);   // 年が1件もないうちはプルダウンを出さない
  }

  function renderList(){
    listEl.textContent = '';
    var shown = items.filter(function(it){
      return current==='all' || (current===NOYEAR ? !it.year : it.year===current);
    });
    cntEl.textContent = shown.length + '本';
    catOrder(shown).forEach(function(cat){
      var group = shown.filter(function(it){ return it.cat===cat; });
      var h2 = document.createElement('h2'); h2.className = 'grp'; h2.textContent = cat;
      var sm = document.createElement('small'); sm.textContent = group.length + '本'; h2.appendChild(sm);
      listEl.appendChild(h2);
      var grid = document.createElement('div'); grid.className = 'grid';
      group.forEach(function(it){ grid.appendChild(card(it)); });
      listEl.appendChild(grid);
    });
    stateEl.hidden = shown.length > 0;
    if (!shown.length) showEmpty('この年の作品はまだありません。');
  }

  function card(it){
    var a = document.createElement('a');
    a.className = 'card'; a.target = '_blank'; a.rel = 'noopener';
    a.href = 'https://www.youtube.com/watch?v=' + it.id;
    a.addEventListener('click', function(){ track('works_video', {cat:it.cat, video_id:it.id}); });

    var th = document.createElement('div'); th.className = 'th';
    var img = document.createElement('img');
    img.loading = 'lazy'; img.alt = '';
    img.src = 'https://img.youtube.com/vi/' + it.id + '/hqdefault.jpg';
    th.appendChild(img);
    var pl = document.createElement('span'); pl.className = 'play'; pl.setAttribute('aria-hidden','true'); pl.textContent = '▶';
    th.appendChild(pl);
    a.appendChild(th);

    var tx = document.createElement('div'); tx.className = 'txt';
    var cat = document.createElement('span'); cat.className = 'cat ' + (CAT_CLASS[it.cat]||''); cat.textContent = it.cat;
    tx.appendChild(cat);
    var h = document.createElement('h3'); h.textContent = it.title || 'YouTubeで見る';
    tx.appendChild(h);
    a.appendChild(tx);

    // タイトルが空欄のときだけ、YouTubeから題名を取ってきます(取れなければそのまま)
    if (!it.title){
      fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + it.id))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){ if (j && j.title){ it.title = j.title; h.textContent = j.title; img.alt = j.title; } })
        .catch(function(){});
    }
    return a;
  }

  sel.addEventListener('change', function(){ current = sel.value; track('works_year', {year:current}); renderList(); });

  function showEmpty(msg){
    stateEl.hidden = false;
    stateEl.textContent = '';
    stateEl.appendChild(document.createTextNode(msg));
  }

  var url = CSV_URL || ('https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + SHEET_GID);
  fetch(url, {cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(t){
      items = toItems(parseCsv(t));
      if (!items.length){ showEmpty('作品は準備中です。下のYouTubeチャンネルから見られます。'); return; }
      buildSelect(); renderList();
    })
    .catch(function(err){
      try{console.warn('works load failed', err);}catch(e){}
      showEmpty('作品の一覧を読み込めませんでした。下のYouTubeチャンネルから見られます。');
    });

  document.querySelectorAll('a[data-track]').forEach(function(a){
    a.addEventListener('click', function(){ track(a.dataset.track); });
  });
})();
</script>
</body>
</html>
